<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #c49c5c, #ffe0b2);
            font-family: Arial, sans-serif;
        }

        .product-detail-row {
            margin-top: 50px;
        }

        /* KHUNG ẢNH */
        .detail-img-box {
            width: 100%;
            height: 420px;
            background: #fff8e1;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ẢNH ĐỒNG ĐỀU */
        .detail-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* TEXT */
        .product-info h2 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-info h4 {
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .product-info p {
            text-align: justify;
            line-height: 1.6;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .product-detail-row {
                margin-top: 20px;
            }

            .detail-img-box {
                height: 300px;
            }
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div id="product-detail"></div>
</div>

<script src="../js/lib.js"></script>

<script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    const product = window.productList.find(item => item.id === productId);

    if (product) {
        document.getElementById("product-detail").innerHTML = `
            <div class="row align-items-center product-detail-row">

                <!-- ẢNH -->
                <div class="col-md-6">
                    <div class="detail-img-box">
                        <img src="${product.image}" 
                             alt="${product.name}" 
                             class="detail-img">
                    </div>
                </div>

                <!-- THÔNG TIN -->
                <div class="col-md-6 product-info">
                    <h2>${product.name}</h2>
                    <h4>${product.price.toLocaleString('vi-VN')}đ</h4>
                    <p>${product.desc}</p>

                    <a href="page6.html" class="btn btn-outline-secondary mt-3">
                        ← Quay lại
                    </a>
                </div>

            </div>
        `;
    } else {
        document.getElementById("product-detail").innerHTML =
            "<h3>Không tìm thấy sản phẩm</h3>";
    }
</script>

</body>
</html>
